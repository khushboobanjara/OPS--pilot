<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsPilot AI - Invoice Operations</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e4e7ec; --accent:#3556d8;
          --green:#157f4b; --amber:#b25e09; --red:#c0342b; --greenbg:#e3f5ec; --amberbg:#fdf0dc; --redbg:#fbe5e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8ebf2; --muted:#9aa3b5; --line:#2c3342; --accent:#7d98ff;
            --green:#4ccf8d; --amber:#f0b155; --red:#ff7b72; --greenbg:#15332a; --amberbg:#3a2d14; --redbg:#3d1f1d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:16px 24px; }
  h1 { font-size:20px; margin:0; } h1 small { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); padding:6px 12px; border-radius:6px; }
  button:hover { border-color:var(--accent); } button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--red); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .metric, .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .metric b { display:block; font-size:22px; } .metric span { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tab { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 14px; }
  .tab.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .item { margin-bottom:12px; } .row { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; }
  .title { font-weight:600; font-size:15px; } .muted { color:var(--muted); }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.green { background:var(--greenbg); color:var(--green); } .pill.amber { background:var(--amberbg); color:var(--amber); }
  .pill.red { background:var(--redbg); color:var(--red); } .pill.gray { background:var(--line); color:var(--muted); }
  ul.reasons { margin:8px 0; padding-left:18px; }
  .bars { display:grid; grid-template-columns:150px 1fr 40px; gap:4px 8px; align-items:center; font-size:12px; margin:8px 0; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  details { margin:8px 0; } summary { cursor:pointer; color:var(--muted); }
  pre { white-space:pre-wrap; background:var(--bg); padding:10px; border-radius:6px; margin:6px 0; font-size:12px; }
  .form { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; margin-bottom:8px; }
  label { display:block; font-size:12px; color:var(--muted); }
  input, select { width:100%; font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:end; } .actions .grow { flex:1; min-width:160px; }
  .err { color:var(--red); margin-top:6px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:12px; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:var(--bg); }
  dialog { width:min(760px,94vw); border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); padding:16px; }
  .step { border-left:2px solid var(--line); padding:0 0 10px 12px; margin-left:4px; }
  .empty { text-align:center; padding:40px; color:var(--muted); }

  /* ---- app shell */
  .app { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  .side { background:#14213d; color:#dbe4ff; padding:18px 12px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
  .brand { font-size:19px; font-weight:700; color:#fff; padding:0 8px; } .brand b { color:#7d98ff; }
  .brand small { display:block; font-size:11px; font-weight:400; color:#9fb0dd; margin:2px 0 14px; }
  .nav { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:none; border:none; color:#dbe4ff; padding:9px 10px; border-radius:8px; }
  .nav:hover { background:#22325a; } .nav.active { background:var(--accent); color:#fff; font-weight:600; }
  .badge { background:#e5484d; color:#fff; border-radius:99px; font-size:11px; padding:0 7px; } .badge:empty { display:none; }
  .sidefoot { margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:0 4px; } .sidefoot a { color:#9fb0dd; font-size:12px; }
  .sidefoot button { background:#22325a; border-color:#2f4278; color:#fff; }
  .content { min-width:0; } .topbar { display:flex; gap:10px; padding:14px 24px; align-items:center; }
  .topbar input { flex:1; max-width:520px; padding:8px 12px; border-radius:8px; }
  #view { padding:0 24px 40px; max-width:1200px; }
  h2.hello { margin:6px 0 2px; font-size:24px; } h2.hello b { color:var(--accent); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:16px 0; }
  .kpi { border-radius:12px; padding:14px 16px; border:1px solid var(--line); background:var(--card); }
  .kpi span { font-size:12px; color:var(--muted); } .kpi b { display:block; font-size:28px; line-height:1.2; } .kpi small { color:var(--muted); }
  .kpi.g { border-left:4px solid var(--green); } .kpi.a { border-left:4px solid var(--amber); } .kpi.r { border-left:4px solid var(--red); } .kpi.p { border-left:4px solid #8b5cf6; } .kpi.b { border-left:4px solid var(--accent); }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; margin-bottom:16px; }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; } .chart h3 { margin:0 0 10px; font-size:14px; }
  .legend { display:grid; gap:4px; font-size:12px; } .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .barlist { display:grid; gap:10px; font-size:12px; }
  .legend div { display:flex; justify-content:space-between; gap:12px; } .donutwrap { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .chart svg { max-width:100%; height:auto; } .axis { fill:var(--muted); font-size:9px; }
  textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); min-height:150px; }
  .pill.purple { background:#ece6fd; color:#6d3fd1; }
  @media (max-width:760px) { .app { grid-template-columns:1fr; } .side { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; } .sidefoot { margin:0; flex-direction:row; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">OpsPilot <b>AI</b><small>Intelligent Business Workflow Automation</small></div>
    <button class="nav active" data-tab="home">Home</button>
    <button class="nav" data-tab="process">Process Email</button>
    <button class="nav" data-tab="all">Invoices</button>
    <button class="nav" data-tab="queue">Review Queue <span class="badge" id="qcount"></span></button>
    <div class="sidefoot"><button id="demo">Load demo data</button><a href="/docs">API docs</a></div>
  </aside>
  <div class="content">
    <div id="banner" hidden style="background:#3b2f0b;color:#f5d98b;padding:8px 16px;font-size:13px;text-align:center"></div>
    <div class="topbar"><input id="search" placeholder="Search invoices by number, vendor or email..."><button id="refresh">Refresh</button></div>
    <main id="view"></main>
  </div>
</div>
<dialog id="audit"><div id="auditBody"></div><div style="text-align:right"><button id="closeAudit">Close</button></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Everything that comes from an email goes through esc(): email content is untrusted input.

const FIELDS = [["vendor_name", "Vendor"], ["invoice_number", "Invoice no."], ["invoice_date", "Invoice date"],
                ["due_date", "Due date"], ["currency", "Currency"], ["total_amount", "Total amount"], ["po_number", "PO number"]];
const SIGNALS = { duplicate: "Duplicate", anomaly: "Amount anomaly", burst: "Burst of invoices", validation_issues: "Validation", extraction_uncertainty: "Extraction doubt" };
let tab = "home", filter = "";

async function api(path, opts = {}, retried = false) {
  const key = sessionStorage.getItem("opspilot_key");
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(key ? { "X-API-Key": key } : {}) } });
  if (r.status === 401 && !retried) {                       // server needs an API key: ask once, remember for this tab
    const k = prompt("This server requires an API key:");
    if (k) { sessionStorage.setItem("opspilot_key", k.trim()); return api(path, opts, true); }
  }
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === "string" ? d : d ? JSON.stringify(d) : r.statusText);
  }
  return data;
}
const money = (amt, cur) => {
  if (amt == null) return "-";
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD" }).format(amt); }
  catch { return `${cur || ""} ${Number(amt).toFixed(2)}`; }
};
const riskClass = r => r == null ? "gray" : r <= 0.30 ? "green" : r < 0.85 ? "amber" : "red";
const riskPill = r => `<span class="pill ${riskClass(r)}">risk ${r == null ? "?" : r.toFixed(2)}</span>`;
const statusPill = s => `<span class="pill ${s === "approved" ? "green" : s === "rejected" ? "red" : "amber"}">${esc(s.replace("_", " "))}</span>`;

// ---------- charts (plain SVG, no libraries, so the page works offline)
const COLORS = { auto: "#22a06b", rev: "#4c7be8", pend: "#f0a23b", rej: "#e5484d", dup: "#8b5cf6" };
function donut(slices, total) {
  let off = 25;
  const arcs = slices.filter(x => x.value > 0).map(x => { const p = x.value / total * 100;
    const e = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${x.color}" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; return e; }).join("");
  return `<svg viewBox="0 0 42 42" width="160" height="160">${total ? arcs : '<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="5"/>'}
    <text x="21" y="22" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">${total}</text>
    <text x="21" y="27.5" text-anchor="middle" font-size="2.7" fill="var(--muted)">Total invoices</text></svg>`;
}
function lineChart(t) {
  if (t.length < 2) return `<div class="empty">Not enough dates yet to draw a trend.</div>`;
  const W = 320, H = 150, L = 26, B = 18, max = Math.max(...t.map(x => x.invoices), 1);
  const X = i => L + i * (W - L - 6) / (t.length - 1), Y = v => H - B - v / max * (H - B - 8);
  const pts = k => t.map((x, i) => `${X(i).toFixed(1)},${Y(x[k]).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${L}" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="var(--line)"/>
    <text class="axis" x="0" y="${Y(max) + 3}">${max}</text><text class="axis" x="0" y="${Y(0) + 3}">0</text>
    <polyline fill="none" stroke="${COLORS.rev}" stroke-width="2" points="${pts("invoices")}"/>
    <polyline fill="none" stroke="${COLORS.auto}" stroke-width="2" points="${pts("auto_approved")}"/>
    <text class="axis" x="${L}" y="${H - 4}">${esc(t[0].date.slice(5))}</text><text class="axis" x="${W - 6}" y="${H - 4}" text-anchor="end">${esc(t[t.length - 1].date.slice(5))}</text></svg>
    <div class="legend"><div><span><i style="background:${COLORS.rev}"></i>Invoices per day</span></div><div><span><i style="background:${COLORS.auto}"></i>Auto processed</span></div></div>`;
}
function barChart(obj) {
  const e = Object.entries(obj).sort((a, b) => b[1] - a[1]), max = Math.max(...e.map(x => x[1]), 1);
  return e.length ? `<div class="barlist">${e.map(([k, v]) => `<div style="display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center">
    <span>${esc(k.replace("_", " "))}</span><div class="bar"><i style="width:${v / max * 100}%"></i></div><b>${v}</b></div>`).join("")}</div>` : `<div class="empty">No emails yet.</div>`;
}

// ---------- stats + home page
let stats = null;
const riskLevel = r => r == null ? ["-", "gray"] : r <= 0.30 ? ["Low", "green"] : r < 0.60 ? ["Medium", "amber"] : ["High", "red"];
function statusLabel(i) {
  if (i.duplicate_of) return ["Duplicate", "purple"];
  if (i.status === "approved") return [i.decision === "auto_approved" ? "Auto processed" : "Approved", "green"];
  if (i.status === "rejected") return ["Rejected", "red"];
  return ["Pending review", "amber"];
}
async function loadStats() {
  stats = await api("/stats");
  $("#qcount").textContent = stats.pending_review || "";
}
function recentTable(list) {
  return list.length ? `<table><thead><tr><th>#</th><th>Vendor</th><th>Invoice</th><th>Amount</th><th>Status</th><th>Risk</th></tr></thead><tbody>` +
    list.map(i => { const [sl, sc] = statusLabel(i), [rl, rc] = riskLevel(i.risk_score);
      return `<tr data-id="${i.id}"><td>${i.id}</td><td>${esc(i.vendor_name || "-")}</td><td>${esc(i.invoice_number || "-")}</td><td>${esc(money(i.total_amount, i.currency))}</td>
        <td><span class="pill ${sc}">${sl}</span></td><td><span class="pill ${rc}">${rl}</span></td></tr>`; }).join("") + `</tbody></table>`
    : `<div class="empty">No invoices yet. Use "Load demo data" or Process Email.</div>`;
}
function renderHome() {
  const st = stats, n = st.invoices, d = st.donut, pct = v => n ? Math.round(v / n * 100) + "%" : "-";
  const slices = [["Auto processed", d.auto_processed, COLORS.auto], ["Approved by reviewer", d.approved_by_reviewer, COLORS.rev],
    ["Pending review", d.pending_review, COLORS.pend], ["Rejected", d.rejected, COLORS.rej], ["Duplicates", d.duplicates, COLORS.dup]];
  const sv = st.estimated_savings;
  $("#view").innerHTML = `
    <div class="row"><div><h2 class="hello">Welcome to OpsPilot <b>AI</b></h2><div class="muted">Automate business workflows. Reduce manual effort. Focus on what matters.</div></div>
      <button class="primary" data-tab="process">Process New Email</button></div>
    <div class="kpis">
      <div class="kpi b"><span>Total invoices</span><b>${n}</b><small>${st.emails_received} emails received</small></div>
      <div class="kpi g"><span>Auto processed</span><b>${st.by_decision.auto_approved || 0}</b><small>${pct(st.by_decision.auto_approved || 0)} of invoices</small></div>
      <div class="kpi a"><span>Pending review</span><b>${st.pending_review}</b><small>${pct(st.pending_review)} of invoices</small></div>
      <div class="kpi r"><span>High risk</span><b>${st.high_risk}</b><small>risk at or above ${st.high_risk_threshold}</small></div>
      <div class="kpi p"><span>Duplicates</span><b>${st.duplicates}</b><small>${pct(st.duplicates)} of invoices</small></div></div>
    <div class="charts">
      <div class="chart"><h3>Invoice processing status</h3><div class="donutwrap">${donut(slices.map(([l, v, c]) => ({ label: l, value: v, color: c })), n)}
        <div class="legend">${slices.map(([l, v, c]) => `<div><span><i style="background:${c}"></i>${l}</span><b>${v}</b></div>`).join("")}</div></div></div>
      <div class="chart"><h3>Invoices over time</h3>${lineChart(st.timeline)}</div>
      <div class="chart"><h3>What arrives in the inbox</h3>${barChart(st.categories)}</div></div>
    <div class="row" style="margin-bottom:8px"><h3 style="margin:0">Recent invoices</h3><button data-tab="all">View all</button></div>
    ${recentTable(st.recent)}
    <p class="muted" style="font-size:12px">Estimated time saved: ${sv.hours} h (about ${sv.cost} in cost). ${esc(sv.assumptions)}. This is an estimate, not a measurement. Average pipeline time ${st.avg_pipeline_ms_per_email ?? "-"} ms per email.</p>`;
}

// ---------- process a pasted email
function renderProcess() {
  $("#view").innerHTML = `<h2 class="hello">Process an email</h2><div class="muted" style="margin-bottom:12px">Paste an invoice email. It goes through the same pipeline as mail arriving from the inbox.</div>
    <div class="item"><div class="fields"><div><label>From</label><input id="pFrom" value="billing@acme.example"></div><div><label>Subject</label><input id="pSubj" value="Invoice INV-20001"></div></div>
    <label>Body</label><textarea id="pBody">Hello,\n\nPlease find invoice INV-20001 attached.\nVendor: Acme Supplies Ltd\nInvoice Date: ${new Date().toISOString().slice(0, 10)}\nDue Date: ${new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10)}\nTotal Amount: USD 1250.00\n\nRegards,\nAcme Supplies Ltd</textarea>
    <div class="actions" style="margin-top:10px"><button class="primary" id="pGo">Process</button></div><div id="pOut"></div></div>`;
  $("#pGo").onclick = async () => {
    const out = $("#pOut"); out.innerHTML = "";
    try {
      const r = await api("/emails", { method: "POST", body: JSON.stringify({ message_id: "manual-" + Date.now(), sender: $("#pFrom").value, subject: $("#pSubj").value, body: $("#pBody").value }) });
      const inv = r.invoice;
      out.innerHTML = `<div class="item" style="margin-top:12px"><b>Decision: ${esc((r.decision || "").replace("_", " "))}</b>${inv ? ` ${riskPill(inv.risk_score)} <span class="muted">${esc(inv.vendor_name || "")} ${esc(inv.invoice_number || "")} ${esc(money(inv.total_amount, inv.currency))}</span>` : ""}
        <ul class="reasons">${((inv && inv.decision_reasons) || r.flags || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${inv ? `<button data-action="audit-id" data-id="${inv.id}">Audit trail</button>` : ""}</div>`;
      await loadStats();
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
}

// ---------- review queue
function queueCard(inv) {
  const bars = Object.entries(SIGNALS).map(([k, label]) => {
    const v = (inv.risk_breakdown || {})[k] || 0;
    return `<div>${esc(label)}</div><div class="bar"><i style="width:${Math.round(v * 100)}%"></i></div><div>${v.toFixed(2)}</div>`;
  }).join("");
  const inputs = FIELDS.map(([k, label]) =>
    `<div><label>${esc(label)}</label><input data-field="${k}" data-orig="${esc(inv[k] ?? "")}" value="${esc(inv[k] ?? "")}" ${inv[k] == null ? 'placeholder="missing"' : ""}></div>`).join("");
  return `<div class="item" data-id="${inv.id}">
    <div class="row"><div><span class="title">${esc(inv.vendor_name || "Unknown vendor")}</span>
      <span class="muted"> ${esc(inv.invoice_number || "no invoice number")} - #${inv.id}</span></div>
      <div>${riskPill(inv.risk_score)} <b>${esc(money(inv.total_amount, inv.currency))}</b></div></div>
    <ul class="reasons">${(inv.decision_reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    ${inv.duplicate_of ? `<div class="muted">Similar to invoice #${inv.duplicate_of}</div>` : ""}
    <div class="bars">${bars}</div>
    <details><summary>Original email: ${esc(inv.email ? inv.email.subject : "")}</summary>
      <pre>${esc(inv.email ? "From: " + inv.email.sender + "\n\n" + inv.email.body : "")}</pre></details>
    <div class="form">
      <details><summary>Correct extracted fields (optional)</summary><div class="fields" style="margin-top:8px">${inputs}</div></details>
      <div class="actions">
        <div><label>Your name</label><input class="reviewer" placeholder="e.g. Khushboo"></div>
        <div class="grow"><label>Comment</label><input class="comment" placeholder="Why?"></div>
        <button class="primary" data-action="approve">Approve</button>
        <button class="danger" data-action="reject">Reject</button>
        <button data-action="audit">Audit trail</button>
      </div>
      <div class="err"></div>
    </div></div>`;
}

async function renderQueue() {
  const q = await api("/review-queue");
  $("#view").innerHTML = q.length ? q.map(queueCard).join("") : `<div class="empty">Nothing waiting for review. Use "Load demo data" to see the workflow.</div>`;
  const saved = localStorage.getItem("reviewer") || "";
  document.querySelectorAll(".reviewer").forEach(i => (i.value = saved));
}

async function submitReview(card, action) {
  const err = $(".err", card), reviewer = $(".reviewer", card).value.trim();
  err.textContent = "";
  if (!reviewer) { err.textContent = "Enter your name so the decision is recorded in the audit log."; return; }
  localStorage.setItem("reviewer", reviewer);
  const corrections = {};
  card.querySelectorAll("[data-field]").forEach(i => {
    const v = i.value.trim();
    if (v !== i.dataset.orig && v !== "") corrections[i.dataset.field] = i.dataset.field === "total_amount" ? parseFloat(v) : v;
  });
  try {
    await api(`/invoices/${card.dataset.id}/review`, { method: "POST", body: JSON.stringify(
      { action, reviewer, comment: $(".comment", card).value, corrections: Object.keys(corrections).length ? corrections : null }) });
    await refresh();
  } catch (e) { err.textContent = e.message; }
}

// ---------- all invoices
async function renderAll() {
  const q = $("#search").value.trim().toLowerCase();
  let list = await api("/invoices?limit=1000" + (filter ? `&status=${filter}` : ""));
  if (q) list = list.filter(i => [i.vendor_name, i.invoice_number, "#" + i.id].some(v => String(v || "").toLowerCase().includes(q)));
  $("#view").innerHTML = `<div style="margin-bottom:10px;max-width:220px"><select id="statusFilter">
      ${["", "approved", "pending_review", "rejected"].map(s => `<option value="${s}" ${s === filter ? "selected" : ""}>${s ? s.replace("_", " ") : "All statuses"}</option>`).join("")}
    </select></div>` + (list.length ? `<table><thead><tr><th>#</th><th>Vendor</th><th>Invoice</th><th>Amount</th><th>Risk</th><th>System decision</th><th>Status</th><th>Reviewed by</th></tr></thead><tbody>` +
    list.map(i => `<tr data-id="${i.id}"><td>${i.id}</td><td>${esc(i.vendor_name || "-")}</td><td>${esc(i.invoice_number || "-")}</td>
      <td>${esc(money(i.total_amount, i.currency))}</td><td>${riskPill(i.risk_score)}</td><td>${esc((i.decision || "").replace("_", " "))}</td>
      <td>${statusPill(i.status)}</td><td>${esc(i.reviewed_by || "-")}</td></tr>`).join("") + `</tbody></table>`
    : `<div class="empty">No invoices yet.</div>`);
}

// ---------- audit trail
async function showAudit(id) {
  const rows = await api(`/invoices/${id}/audit`);
  $("#auditBody").innerHTML = `<h3 style="margin-top:0">Audit trail - invoice #${id}</h3>` + rows.map(r => {
    const d = r.details || {};
    const bits = [];
    if (d.rule) bits.push(`rule: ${d.rule}`);
    if (d.comment) bits.push(`comment: ${d.comment}`);
    if (d.corrections && Object.keys(d.corrections).length) bits.push("corrections: " + JSON.stringify(d.corrections));
    if (d.flags && d.flags.length) bits.push(d.flags.join(" | "));
    return `<div class="step"><b>${esc(r.stage)}</b> - ${esc(r.action)}
      <span class="muted">by ${esc(r.actor)}${r.duration_ms != null ? `, ${r.duration_ms} ms` : ""} - ${esc(new Date(r.timestamp + "Z").toLocaleString())}</span>
      ${bits.length ? `<div class="muted">${esc(bits.join("  /  "))}</div>` : ""}</div>`;
  }).join("");
  $("#audit").showModal();
}

// DEMO-START
function demoEmails() {
  const run = Math.random().toString(36).slice(2, 7);
  let seq = 0;
  const num = () => "INV-" + (10000 + Math.floor(Math.random() * 89999));
  const iso = d => d.toISOString().slice(0, 10);
  const mk = (vendor, number, amount, opts = {}) => {
    const d = new Date(Date.UTC(2026, 2 + Math.floor(Math.random() * 5), 1 + Math.floor(Math.random() * 27)));
    const due = new Date(d.getTime() + 30 * 86400000);
    // random cents so loading the demo twice does not look like a resubmission of the same amount
    if (!opts.exact) amount += Math.floor(Math.random() * 100) / 100;
    const body = `Hello,\n\nPlease find invoice ${number} attached.\nVendor: ${vendor}\nInvoice Date: ${iso(d)}\n` +
      (opts.noDue ? "" : `Due Date: ${iso(due)}\n`) + `Total Amount: USD ${amount.toFixed(2)}\n\nRegards,\n${vendor}`;
    return { message_id: `demo-${run}-${seq++}`, sender: `billing@${vendor.toLowerCase().replace(/[^a-z]/g, "")}.com`,
             subject: `Invoice ${number}`, body };
  };
  const out = [];
  [1000, 1040, 980, 1020, 1010].forEach(a => out.push(mk("Acme Supplies Ltd", num(), a)));
  [450, 470, 430, 465].forEach(a => out.push(mk("BrightCloud Hosting", num(), a)));
  out.push(mk("Acme Supplies Ltd", num(), 6400));                       // unusual amount for this vendor
  const dupNumber = num(), dupAmount = 512 + Math.floor(Math.random() * 100) / 100;
  out.push(mk("BrightCloud Hosting", dupNumber, dupAmount, { exact: true }));
  out.push({ ...mk("BrightCloud Hosting", dupNumber, dupAmount, { exact: true }), message_id: `demo-${run}-${seq++}` });  // exact duplicate
  out.push(mk("Northwind Logistics", num(), 2210.00, { noDue: true }));  // missing due date
  out.push({ message_id: `demo-${run}-${seq++}`, sender: "events@cloudconf.com", subject: "Webinar invitation",
             body: "Hi there,\n\nJoin our free webinar on cloud cost optimisation next Thursday. Register now to save your seat.\n\nCheers,\nThe CloudConf team" });
  return out;
}
// DEMO-END

async function loadDemo() {
  const btn = $("#demo"), emails = demoEmails();
  btn.disabled = true;
  try {
    for (let i = 0; i < emails.length; i++) {
      btn.textContent = `Processing ${i + 1}/${emails.length}...`;
      await api("/emails", { method: "POST", body: JSON.stringify(emails[i]) });   // sequential: order builds vendor history
    }
  } catch (e) { alert("Demo failed: " + e.message); }
  btn.textContent = "Load demo data"; btn.disabled = false;
  await refresh();
}

// ---------- wiring
async function refresh() {
  try {
    await loadStats();
    if (tab === "home") renderHome(); else if (tab === "process") renderProcess(); else if (tab === "queue") await renderQueue(); else await renderAll();
  }
  catch (e) { $("#view").innerHTML = `<div class="empty">Could not reach the API: ${esc(e.message)}</div>`; }
}
document.addEventListener("click", e => {
  const t = e.target;
  const nav = t.closest("[data-tab]");
  if (nav) { tab = nav.dataset.tab; document.querySelectorAll(".nav").forEach(b => b.classList.toggle("active", b.dataset.tab === tab)); refresh(); }
  else if (t.dataset.action === "audit-id") showAudit(t.dataset.id);
  else if (t.dataset.action) {
    const card = t.closest(".item");
    if (t.dataset.action === "audit") showAudit(card.dataset.id); else submitReview(card, t.dataset.action);
  } else if (t.closest("tbody tr")) showAudit(t.closest("tr").dataset.id);
});
document.addEventListener("change", e => { if (e.target.id === "statusFilter") { filter = e.target.value; renderAll(); } });
$("#search").addEventListener("input", () => { if (tab !== "all") { tab = "all"; document.querySelectorAll(".nav").forEach(b => b.classList.toggle("active", b.dataset.tab === "all")); } renderAll(); });
$("#refresh").onclick = refresh; $("#demo").onclick = loadDemo; $("#closeAudit").onclick = () => $("#audit").close();
fetch("/health").then(r => r.json()).then(h => {
  if (h.demo_mode) { const b = $("#banner"); b.hidden = false; b.textContent = "Public demo with sample data. Anything you do here is wiped automatically every hour."; }
}).catch(() => {});
refresh();
</script>
