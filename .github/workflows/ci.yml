name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train models
        run: |
          python -m app.ml.train_classifier
          python -m app.ml.train_anomaly
          python -m app.ml.train_extractor
      - name: Tests
        run: pytest -q
      - name: Evaluation report
        run: |
          python -m scripts.evaluate_duplicates
          python -m scripts.evaluate_decisions
