name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train models
        run: |
          python -m app.ml.train_classifier
          python -m app.ml.train_anomaly
          python -m app.ml.train_extractor
      - name: Tests
        run: pytest -q
      - name: Evaluation report
        run: |
          python -m scripts.evaluate_duplicates
          python -m scripts.evaluate_decisions

  docker:
    # Proves the Dockerfile and docker-compose.yml work, without needing Docker on your own machine.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: Start the API in demo mode and check it answers
        run: |
          OPSPILOT_DEMO_MODE=true docker compose up -d api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 3; done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q "OpsPilot"
      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
